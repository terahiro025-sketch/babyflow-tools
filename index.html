<!DOCTYPE html> <html lang="ja"><head><meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <title>どこに頼る？｜体の不調の相談先チャート</title> <style> :root{--bg:#f6f8fa;--card:#fff;--tx:#1f2933;--sub:#5b6b78;--ac:#2f6f9f;--acbg:#e8f1f8;--wn:#b3402f;--wnbg:#fdecea;--am:#8a5a00;--ambg:#fff4dc;--bd:#d9e1e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191e;--card:#1d252c;--tx:#e6ebef;--sub:#9aa8b4;--ac:#6fb0dc;--acbg:#1e3342;--wn:#f08a7a;--wnbg:#3a2220;--am:#e6b95a;--ambg:#3a3020;--bd:#33414c}} :root[data-theme="dark"]{--bg:#14191e;--card:#1d252c;--tx:#e6ebef;--sub:#9aa8b4;--ac:#6fb0dc;--acbg:#1e3342;--wn:#f08a7a;--wnbg:#3a2220;--am:#e6b95a;--ambg:#3a3020;--bd:#33414c} html{scroll-padding-top:env(safe-area-inset-top,0px)} body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif} main{max-width:640px;margin:0 auto;padding:16px} h1{font-size:20px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 8px} .sub{color:var(--sub);font-size:13px;margin:0 0 14px} .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0} .prog{font-size:12px;color:var(--sub);margin-bottom:6px} label.it{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer} label.it:last-child{border-bottom:0} input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--ac)} button{font:inherit;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:10px;padding:11px 16px;margin:6px 6px 0 0;cursor:pointer} button.g{background:transparent;color:var(--ac)} button.a{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);margin:8px 0} .box{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px} .wn{background:var(--wnbg);color:var(--wn)}.am{background:var(--ambg);color:var(--am)}.ac{background:var(--acbg)} .fl{border-left:4px solid var(--ac);padding:4px 0 4px 10px;margin:10px 0} .fl b{color:var(--ac)}.fl small{display:block;color:var(--sub)} .h{color:var(--ac)!important}ul{margin:6px 0 6px;padding-left:18px}a{color:var(--ac)}.bf{border-color:var(--ac);background:var(--acbg)} footer{font-size:12px;color:var(--sub);margin:18px 0 8px} </style></head><body><main> <h1>どこに頼る？ <small style="font-size:12px;font-weight:normal;color:var(--am);background:var(--ambg);border-radius:6px;padding:2px 8px;vertical-align:middle">試作版</small></h1> <p class="sub">体の不調の相談先チャート｜診断や、特定の施設の推奨ではなく、相談先を考える手がかりです。</p> <div id="v"></div> <footer>入力した内容は、保存も送信もされません。試作版のため、内容は今後、変わることがあります。このページは、ベイビーフローの発信者が作成しており、ベイビーフローの紹介を含みます。<br>※制度や費用は、地域や時期によって変わります。保険の扱いなどは、お住まいの自治体や、加入している保険者の最新の案内で確認してください。これは医学的な診断・判定ではなく、どの相談先が優れているかを示すものでもありません。</footer> </main> <script> const URG=["両脚のしびれや力の入りにくさが、急に出た","尿や便が出にくい、または漏れる","股のあたりの感覚が鈍い","突然の激しい頭痛がある","突然の激しい首や背中の痛みがある","ろれつが回らない、顔や手足の麻痺、強いめまいがある","転倒や事故のあとに、強い痛みが出た","発熱を伴う、強い痛みや動かしにくさがある"]; const S=[["A","ケガをした（捻る・ぶつける・転ぶなど、きっかけがはっきりしている）"],["B","しびれ・力の入りにくさがある／痛みが長引いて心配"],["C","検査で「異常なし」と言われたが、つらさが続く"],["D","慢性的なこり・痛みを、楽にしたい"],["E","姿勢・筋力・体力など、体を変えていきたい"],["F","通う時間やお金が続かない／どこに行けばいいか分からない"],["G","仕事の負担が関係していそう（働き方・職場の環境など）"],["H","健康グッズ・サプリを買う前に確認したい"],["I","気持ちのつらさが強い（眠れない、気分の落ち込み、死にたい気持ちなど）"]]; const MT={t:"手技系の施術（整体・マッサージ・鍼灸など）を受けるときの目安",l:["国家資格（あん摩マッサージ指圧師・はり師・きゅう師・柔道整復師）か、免許証の掲示などで確認できる","初回に、症状・経過・既往歴をきちんと聞いてくれる","説明が具体的で、断定しすぎない（「骨盤が歪んでいる」「このままだと…」など）","回数・期間・費用の見通しを説明してくれる。高額な回数券を急かされない","症状によっては、医療機関の受診を勧めてくれる","数回受けても変化がないとき、方針を見直してくれる"],n:"施術者による差が大きいと言われます。合わなければ、変えて構いません。"}; const R={A:{t:"ケガをした",m:1,c:[["整形外科","強い腫れ、体重がかけられない、変形があるときは、骨折などの除外のため、まず診断を","保険診療。待ち時間あり。紹介状は、通常は不要"],["整骨院（柔道整復師）","捻挫・打撲・肉離れなどへの対応が得意です。骨折や脱臼の疑いがあるときは、先に整形外科で診断を","外傷は保険。そのほかは自費。予約しやすい所が多い"]],n:"仕事中・通勤中のケガは、労災の扱いになることがあります。職場に確認を。同じケガで、複数の施設を重ねて受けると、保険の対象外になる場合があります。",b:"痛みや腫れが強い間は、無理に動かさず休みます。落ち着いてから、呼吸（フロー1）だけでも。"}, B:{t:"しびれ・力の入りにくさ／痛みが長引く",c:[["整形外科","診断と、重大な原因の除外が目的です。まず、ここが入口になります","保険診療。待ち時間あり"],["かかりつけ医・総合診療","どの科に行けばいいか迷うときの、最初の相談先になります","保険診療。身近で、最初の相談がしやすい"],["神経内科・脳神経外科","しびれや頭痛など、神経が関わる症状の相談先です","保険診療。受診先に迷うときは、かかりつけ医に相談"],["理学療法士（リハビリ）","診断のあとの、運動療法や動作の指導が得意です","医師の診察・指示が前提。通院の頻度に注意"]],n:"急に悪化する場合や、尿・便の異常、ろれつ・麻痺などがあるときは、救急も検討してください。迷うときは、救急安心センター（#7119）が使える地域もあります。診断がつく前の、自己流の運動や強い施術は、控えたほうが安全です。",b:"診断がつくまでは、動きを試す前に、医師に確認してください。"}, C:{t:"検査で「異常なし」と言われた",m:1,c:[["理学療法士（リハビリ）","運動療法や動作の指導が得意です。自費の施設もあります（内容は施設により差があります）","保険のリハビリは、医師の診察・指示が必要。自費は施設により費用に差"],["ピラティスなど、個別・少人数の運動指導","動きの質に、丁寧に目を向けてもらえます（医療ではありません）","自費。体験を用意している所が多い。費用は施設により差が大きい"],["鍼灸（はり師・きゅう師）","慢性的な痛みに対して、選択肢のひとつとして利用されています。条件によっては、医師の同意書で保険が使えます","条件を満たせば保険。それ以外は自費"],["ペインクリニック（麻酔科）","慢性的な痛みの相談先のひとつ。薬や注射なども選択肢になります","保険診療。予約制や、紹介状を求める所もある"],["かかりつけ医・心療内科","睡眠や気分の落ち込み、ストレスも気になるときの、相談先になります","保険診療。心療内科は予約制が多い"]],n:"不調には、動き方のほかに、睡眠・ストレス・仕事の負荷なども関わります。「異常なし」と言われたあとでも、症状が変わった・強くなったときは、あらためて受診してください。",b:"通う合間や、通う前後の、日常のホームケアとして。順番どおりに、できる範囲で。"}, D:{t:"慢性的なこり・痛みを楽にしたい",m:1,c:[["マッサージ・鍼灸・整体","気持ちよさや、緊張の緩和が得意です。国家資格か、民間資格かを、確認できます","医療目的以外は自費。予約しやすいが、資格・技術の差が大きい"],["ストレッチ","自分でも、手軽にできます。痛みを我慢しない範囲で","費用がかからない方法もあり、気軽"],["薬局・薬剤師","湿布や鎮痛薬の選び方、飲み合わせを相談できます","相談は気軽。症状が続くときは、受診を"]],n:"楽になってもまた戻る場合は、動き方や生活の見直しも検討を。痛みが2〜3週間以上続く、夜も痛む、しびれがあるときは、受診を検討してください。",b:"施術と施術の間の、合間のホームケアとして。"}, E:{t:"体を変えていきたい",c:[["筋トレ（ジム・パーソナル）","筋力や体力を、長期的に積み上げるのが得意です","自費・月額制が多い。体験を用意している所が多い"],["ピラティス","体幹・姿勢・動作の質に、丁寧に取り組めます","自費。費用は施設により差が大きい"],["ヨガ","呼吸や柔軟性、リラックスを重視。続けやすい雰囲気です","自費。教室により差がある。体験しやすい"]],n:"痛みがある場合は、先に、医療機関に相談を。指導者の質には差があるので、体験で確認すると安心です。",b:"運動の習慣がない人の、入口として。教室に通う前の準備にも。"}, F:{t:"通えない／どこに行けばいいか分からない",c:[["保健センター・自治体の健康相談","無料または低額で、気軽に相談できます。内容は地域によって異なります","無料〜低額。地域により内容・日程が異なる"],["かかりつけ医","まず、どこに行けばいいかを相談できます","保険診療。身近で相談しやすい"],["加入している保険者の相談窓口","健康相談などの窓口が、ある場合があります","加入先の案内を確認"],["病院の医療相談室（医療ソーシャルワーカ―）","医療費や通院の負担、利用できる制度について、相談できる場合があります。受診先の病院で窓口を確認できます","無料の場合が多い。設置の有無は病院による"],["地域包括支援センター","高齢の方（65歳以上）や、そのご家族の相談窓口です","無料。高齢の方向け"]],n:"無理に通い続けなくて大丈夫です。通える範囲で、できることから。",b:"ホームケアの選択肢のひとつとして。つらい日は、フロー1の呼吸だけ（足は床につけたままで可）でも。痛みが強い日は休んでください。"}, G:{t:"仕事の負担が関係していそう",c:[["産業医・職場の健康相談窓口","職場に制度があれば、相談できます","職場に制度があれば無料。使いやすさは職場による"],["産業保健総合支援センター","働く人や事業者向けの、産業保健の相談窓口があります（地域の窓口を確認）","相談は、無料の場合が多い"],["医療機関（整形外科など）","仕事が関係すると思われる症状は、受診して、状況を医師に伝えます","保険診療"]],n:"業務が原因の病気やケガは、労災の対象になる場合があります。職場や、労働基準監督署に確認できます。",b:"仕事の合間のコンディショニングとして。職場の環境改善の代わりにはなりません。"}, H:{t:"健康グッズ・サプリを買う前に",c:[["表示を確認する","トクホは、国が審査して許可したもの。機能性表示食品は、国の審査はなく、事業者の責任で届け出たもの。「栄養補助食品」「健康補助食品」などの表示は一般食品で、機能性は表示できません","パッケージや販売ページの表示で確認できる"],["費用と解約を確認する","初回が安くても、定期購入が条件になっていないか。解約・返品の条件、連絡方法、期限を、購入前に確認します","購入前に、最終確認画面などを保存しておくと安心"],["医師・薬剤師に相談する","持病がある、薬を飲んでいる、妊娠中・授乳中の方は、購入前に確認を","薬局は、気軽に相談できる"],["消費者ホットライン「188」","購入でトラブルになったとき、最寄りの消費生活センターにつながります","相談できる窓口"]],n:"「必ず」「これだけで」「治る」などの断定や、体験談だけで根拠の説明がない広告は、注意のサインです。食品は医薬品ではなく、「治る」といった効果はうたえません。症状が続くときは、サプリやグッズより先に、受診を検討してください。",b:"このページでは、特定の商品を紹介せず、優劣もつけません。ベイビーフローは、道具を使わず、床の上でできるホームケアです。"}, I:{t:"気持ちのつらさが強い",c:[["#いのちSOS（24時間・無料）","「死にたい」「消えたい」などの気持ちを、専門の相談員が受け止めます。電話：<a href=\"tel:0120061338\">0120-061-338</a>","24時間365日・無料"],["よりそいホットライン（24時間・無料）","さまざまな悩みの相談を受け付けています。電話：<a href=\"tel:0120279338\">0120-279-338</a>（岩手・宮城・福島からは0120-279-226）","24時間・無料"],["こころの健康相談統一ダイヤル","お住まいの地域の、公的な相談機関につながります。電話：<a href=\"tel:0570064556\">0570-064-556</a>","通話料がかかります"],["心療内科・精神科、かかりつけ医","眠れない、気分の落ち込みが続くときの、医療の相談先です","保険診療。予約制が多い"]],n:"今すぐ命の危険があるときは、119または110へ連絡してください。ひとりで抱え込まず、身近な人にも、伝えてみてください。",b:"つらいときは、動くことを無理にすすめません。まず、相談窓口へ。ベイビーフローは、気持ちが少し落ち着いてからで構いません。"}}; const V=document.getElementById("v");let st={step:0,urg:[]}; function render(){let h=""; if(st.step==0){h=`<div class="prog">ステップ 0／2 まず安全確認</div><div class="card"><h2>当てはまるものはありますか？</h2>${URG.map((t,i)=>`<label class="it"><input type="checkbox" value="${i}" ${st.urg.includes(i)?"checked":""}><span>${t}</span></label>`).join("")}</div><button onclick="go()">次へ</button><button class="g" onclick="st.k='I';st.step=2;render()">気持ちのつらさが強い方は、こちら</button>`} if(st.step==9){h=`<div class="box wn"><b>運動や相談先探しより先に、医療機関へ</b><br>緊急性のある症状の可能性があります。急に強くなる場合や、麻痺・ろれつの異常などがあるときは、救急要請も検討してください。このチャートは、ここで終了します。</div><button class="g" onclick="st={step:0,urg:[]};render()">最初に戻る</button>`} if(st.step==1){h=`<div class="prog">ステップ 1／2</div><div class="card"><h2>いまの状況に、いちばん近いものは？</h2>${S.map(s=>`<button class="a" onclick="st.k='${s[0]}';st.step=2;render()">${s[1]}</button>`).join("")}</div><button class="g" onclick="st.step=0;render()">戻る</button>`} if(st.step==2){const r=R[st.k];h=`<div class="prog">ステップ 2／2 結果</div><h2>${r.t}</h2><div class="box ac">相談先の<b>候補</b>です。順番や優劣ではありません。</div>${r.c.map(x=>`<div class="fl"><b>${x[0]}</b><small>${x[1]}</small>${x[2]?`<small class="h">頼りやすさ：${x[2]}</small>`:""}</div>`).join("")}<div class="card"><b>注意したいこと</b><br>${r.n}</div>${r.m?`<div class="card"><b>${MT.t}</b><ul>${MT.l.map(x=>`<li>${x}</li>`).join("")}</ul><small class="sub">${MT.n}</small></div>`:""}<div class="card bf"><b>ベイビーフローの位置づけ</b><br>${r.b}<small class="sub" style="display:block;margin-top:6px">治療ではありません。医療・施術・運動指導の代わりではなく、通えない間や合間のホームケアです。</small>${st.k!="B"&&st.k!="I"?`<a href="https://note.com/calm_plover523/n/nd14e9198d188" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;font-size:14px;font-weight:bold">やり方・全体像を見る（note）→</a>`:""}</div>${st.k!="I"?`<div class="box am">急な悪化や、しびれ・力の入りにくさが出たときは、運動より先に医療機関へ。</div><div class="card"><small class="sub">気持ちのつらさが強いときや、眠れない状態が続くときは、体の不調と合わせて、相談窓口も確認してください。</small><br><button class="g" onclick="st.k='I';render();scrollTo(0,0)">気持ちのつらさの相談先を見る</button></div>`:""}${st.k!="B"&&st.k!="I"?`<div class="card"><small class="sub">動き方の傾向を見てみたい方は、<a href="check.html">「からだのセルフチェック」</a>もどうぞ。</small></div>`:""}<button onclick="st={step:0,urg:[]};render()">最初からやり直す</button><button class="g" onclick="st.step=1;render()">状況を選び直す</button>`} document.getElementById("v").innerHTML=h; V.querySelectorAll("input[type=checkbox]").forEach(e=>e.onchange=()=>{const v=+e.value;e.checked?st.urg.push(v):st.urg.splice(st.urg.indexOf(v),1)})} function go(){st.step=st.urg.length?9:1;render()} render(); </script></body></html>
