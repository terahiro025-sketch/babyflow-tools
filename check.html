<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>からだのセルフチェック｜ベイビーフロー</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--tx:#1f2933;--sub:#5b6b78;--ac:#2f6f9f;--acbg:#e8f1f8;--wn:#b3402f;--wnbg:#fdecea;--am:#8a5a00;--ambg:#fff4dc;--bd:#d9e1e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191e;--card:#1d252c;--tx:#e6ebef;--sub:#9aa8b4;--ac:#6fb0dc;--acbg:#1e3342;--wn:#f08a7a;--wnbg:#3a2220;--am:#e6b95a;--ambg:#3a3020;--bd:#33414c}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--sub);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.prog{font-size:12px;color:var(--sub);margin-bottom:6px}
label.it{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
label.it:last-child{border-bottom:0}
input[type=checkbox],input[type=radio]{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--ac)}
button{font:inherit;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:10px;padding:11px 16px;margin:6px 6px 0 0;cursor:pointer}
button.g{background:transparent;color:var(--ac)}
button.a{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);margin:8px 0;padding:12px}
.box{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.wn{background:var(--wnbg);color:var(--wn)}.am{background:var(--ambg);color:var(--am)}.ac{background:var(--acbg)}
.fl{border-left:4px solid var(--ac);padding:4px 0 4px 10px;margin:10px 0}
.fl b{color:var(--ac)}.fl small{display:block;color:var(--sub)}
footer{font-size:12px;color:var(--sub);margin:18px 0 8px}
a{color:var(--ac)}
</style>
</head>
<body>
<main>
<h1>からだのセルフチェック</h1>
<p class="sub">ベイビーフロー｜原因の「診断」ではなく、動き方の傾向から、試すフローの候補を探すための目安です。通院や運動教室に通えない間・合間のホームケアとしてご活用ください（通院の代わりではありません）。</p>
<div id="v"></div>
<footer>
※これは医学的に検証された判定ツールではなく、著者の解釈にもとづく目安です。診断・治療の代わりにはなりません。症状が続く、または強いときは、医療機関へご相談ください。
</footer>
</main>
<script>
const URG=[
  "両脚のしびれや力の入りにくさが、急に出た",
  "尿や便が出にくい、または漏れる",
  "股のあたりの感覚が鈍い",
  "突然の激しい頭痛がある",
  "突然の激しい首や背中の痛みがある",
  "ろれつが回らない、顔や手足の麻痺、強いめまいがある",
  "転倒や事故のあとに、強い痛みが出た",
  "発熱を伴う、強い痛みや動かしにくさがある"
];

const QS=[
  {
    q:"ふだんの呼吸やお腹の感覚で、近いものは？",
    o:[
      {t:"息を吸うと肩や胸ばかりが持ち上がり、お腹が動きにくい",f:[1,2]},
      {t:"息を吐ききれず、常に胸やお腹が突っ張っている",f:[1]},
      {t:"お腹まわりは自然に広がり、特に問題を感じない",f:[]}
    ]
  },
  {
    q:"あお向けで寝たときの腰や首の感覚は？",
    o:[
      {t:"腰が浮いて落ち着かない／足を伸ばすと腰が重い",f:[1,2]},
      {t:"顎が上がってしまい、首の後ろが突っ張る",f:[1,3]},
      {t:"特に違和感なく、床に平らに預けられている",f:[]}
    ]
  },
  {
    q:"座っているときや立っているときの姿勢は？",
    o:[
      {t:"背中が丸まりやすく、お腹に力が入らない（丸まりがち）",f:[2,3]},
      {t:"無理に胸を張って背中を反らせている（反り腰になりがち）",f:[1,4]},
      {t:"姿勢を保つのにそれほど力みは感じない",f:[]}
    ]
  },
  {
    q:"日常の動作で、いちばん負担を感じやすい部位は？",
    o:[
      {t:"首・肩のこりや、頭の重さ",f:[1,3]},
      {t:"腰・股関節の重だるさや詰まり感",f:[2,4]},
      {t:"特に偏った疲れや張りは感じていない",f:[]}
    ]
  }
];

const FLOWS={
  1:{name:"フロー1：呼吸とリセット",desc:"あお向けでの呼吸。肋骨とお腹の360度の広がりを取り戻し、全身の余計な力みを抜く基本です。"},
  2:{name:"フロー2：脚の引き上げと安定",desc:"股関節を無理なく曲げ、体幹（お腹まわり）の支えを感じながら脚を動かす土台を作ります。"},
  3:{name:"フロー3：うつ伏せ・肘つき（スフィンクス）",desc:"胸椎（背中の上部）を開き、首や肩に頼らずに頭を支える感覚を整えます。"},
  4:{name:"フロー4：四つ這い・ロッキング",desc:"股関節と体幹を連動させ、背骨の自然なカーブを保ったまま重心を前後に移動させる練習です。"}
};

const V=document.getElementById("v");
let st={step:0,urg:[],answers:[]};

function render(){
  let h="";
  if(st.step==0){
    h=`<div class="prog">ステップ 0／2 まず安全確認</div>
    <div class="card">
      <h2>当てはまるものはありますか？</h2>
      ${URG.map((t,i)=>`<label class="it"><input type="checkbox" value="${i}" ${st.urg.includes(i)?"checked":""}><span>${t}</span></label>`).join("")}
    </div>
    <button onclick="go()">チェックを始める</button>`;
  }
  if(st.step==9){
    h=`<div class="box wn">
      <b>セルフチェックや運動より先に、医療機関へ</b><br>
      緊急性のある症状や、詳しい診察が必要な状態の可能性があります。無理に動かさず、受診を優先してください。
    </div>
    <button class="g" onclick="st={step:0,urg:[],answers:[]};render()">最初に戻る</button>`;
  }
  if(st.step>=1 && st.step<=QS.length){
    const idx=st.step-1;
    const q=QS[idx];
    h=`<div class="prog">質問 ${st.step}／${QS.length}</div>
    <div class="card">
      <h2>${q.q}</h2>
      ${q.o.map((opt,oi)=>`<button class="a" onclick="pick(${oi})">${opt.t}</button>`).join("")}
    </div>
    <button class="g" onclick="st.step--;render()">戻る</button>`;
  }
  if(st.step>QS.length){
    const counts={1:0,2:0,3:0,4:0};
    st.answers.forEach(a=>{
      a.forEach(f=>{if(counts[f]!==undefined) counts[f]++});
    });
    let cand=Object.keys(counts).filter(k=>counts[k]>0).sort((a,b)=>counts[b]-counts[a]);
    if(cand.length==0) cand=[1];

    h=`<div class="prog">チェック結果</div>
    <h2>おすすめのベイビーフロー候補</h2>
    <div class="box ac">選んだ回答の傾向から、まず試してみるのがおすすめのフローです。</div>`;

    cand.slice(0,2).forEach(fId=>{
      const f=FLOWS[fId];
      h+=`<div class="fl"><b>${f.name}</b><small>${f.desc}</small></div>`;
    });

    h+=`<div class="card">
      <b>注意したいこと</b><br>
      痛みを我慢して動かす必要はありません。違和感や強い張りを感じる場合は、無理をせず「フロー1の呼吸」から少しずつ試してください。
    </div>
    <div class="card" style="border-color:var(--ac);background:var(--acbg)">
      <b>ベイビーフローの解説</b><br>
      各フローの具体的な手順やポイントはnoteでご確認いただけます。<br>
      <a href="https://note.com/calm_plover523/n/nd14e9198d188" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;font-weight:bold">やり方・全体像を見る（note）→</a>
    </div>
    <div class="card">
      <small class="sub">相談先（病院・整骨院など）に迷っている方はこちら：</small><br>
      <a href="index.html" style="display:inline-block;margin-top:6px;font-weight:bold">「どこに頼る？（相談先チャート）」を開く →</a>
    </div>
    <button onclick="st={step:0,urg:[],answers:[]};render()">最初からやり直す</button>`;
  }

  V.innerHTML=h;
  V.querySelectorAll("input[type=checkbox]").forEach(e=>e.onchange=()=>{
    const v=+e.value;
    e.checked?st.urg.push(v):st.urg.splice(st.urg.indexOf(v),1);
  });
}

function go(){st.step=st.urg.length?9:1;render()}
function pick(oi){
  const idx=st.step-1;
  st.answers[idx]=QS[idx].o[oi].f;
  st.step++;
  render();
}
render();
</script>
</body>
</html>
